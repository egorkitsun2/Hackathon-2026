<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Варианты страницы входа — Голос команды</title>
</head>
<body>
<div id="team-login-designs">
  <nav class="preview-picker" aria-label="Варианты оформления">
    <button type="button" data-design="0" aria-pressed="true">Карточка</button>
    <button type="button" data-design="1" aria-pressed="false">Открытая форма</button>
    <button type="button" data-design="2" aria-pressed="false">Компактный</button>
  </nav>
  <div class="preview-variants" aria-label="Варианты страницы входа">
    <section data-variant="Карточка" aria-label="Вариант Карточка"><div class="login-mock layout-card"></div></section>
    <section data-variant="Открытая форма" aria-label="Вариант Открытая форма" hidden><div class="login-mock layout-open"></div></section>
    <section data-variant="Компактный" aria-label="Вариант Компактный" hidden><div class="login-mock layout-compact"></div></section>
  </div>
</div>
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }
  #team-login-designs .preview-picker { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; background: #ffffff; font: 16px/1.5 system-ui, sans-serif; }
  #team-login-designs .preview-picker button { min-height: 44px; padding: 8px 16px; border: 1px solid #9ca3af; border-radius: 8px; background: #ffffff; color: #1f2937; font: inherit; }
  #team-login-designs .preview-picker button[aria-pressed="true"] { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  #team-login-designs { color-scheme: light; }
  #team-login-designs .login-mock {
    --mock-accent: #2563eb;
    --mock-background: #f6f8fb;
    --mock-surface: #ffffff;
    --mock-text: #1f2937;
    --mock-muted: #4b5563;
    --mock-border: #9ca3af;
    --mock-radius: 12px;
    min-height: 650px;
    background: var(--mock-background);
    color: var(--mock-text);
    font: 16px/1.5 system-ui, sans-serif;
    padding: 24px;
  }
  #team-login-designs .login-mock * { box-sizing: border-box; }
  #team-login-designs .mock-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  #team-login-designs .mock-brand { font-size: 18px; font-weight: 600; margin: 0; }
  #team-login-designs .mock-languages { display: flex; align-items: center; gap: 4px; }
  #team-login-designs .mock-languages button { background: transparent; border: 0; padding: 8px; min-height: 44px; color: var(--mock-muted); font: inherit; }
  #team-login-designs .mock-languages button[aria-pressed="true"] { color: var(--mock-accent); text-decoration: underline; text-underline-offset: 5px; }
  #team-login-designs .mock-form { max-width: 400px; margin: 40px auto 0; padding: 28px; background: var(--mock-surface); border: 1px solid #e5e7eb; border-radius: var(--mock-radius); }
  #team-login-designs h2 { font: 600 26px/1.25 system-ui, sans-serif; margin: 0 0 8px; }
  #team-login-designs p { margin: 0; }
  #team-login-designs .mock-hint { color: var(--mock-muted); font-size: 14px; margin-bottom: 24px; }
  #team-login-designs label { display: block; margin: 18px 0 8px; font-weight: 500; }
  #team-login-designs input { width: 100%; min-width: 0; height: 46px; padding: 10px 12px; border: 1px solid var(--mock-border); border-radius: var(--mock-radius); background: var(--mock-surface); color: var(--mock-text); font: inherit; }
  #team-login-designs .mock-password { display: flex; gap: 8px; }
  #team-login-designs .mock-password input { flex: 1; }
  #team-login-designs .mock-toggle { background: var(--mock-surface); border: 1px solid var(--mock-border); border-radius: var(--mock-radius); padding: 8px; color: var(--mock-text); font: 14px system-ui, sans-serif; }
  #team-login-designs .mock-submit { width: 100%; min-height: 46px; margin-top: 24px; padding: 10px; border: 1px solid var(--mock-accent); border-radius: var(--mock-radius); background: var(--mock-accent); color: #ffffff; font: 500 16px system-ui, sans-serif; }
  #team-login-designs .mock-status { margin-top: 16px; color: var(--mock-muted); font-size: 13px; }
  #team-login-designs .mock-access { margin-top: 24px; text-align: center; font-size: 14px; color: var(--mock-muted); }
  #team-login-designs button { cursor: pointer; }
  #team-login-designs button:focus-visible, #team-login-designs input:focus-visible { outline: 3px solid var(--mock-accent); outline-offset: 3px; }
  #team-login-designs .layout-open { --mock-background: #ffffff; }
  #team-login-designs .layout-open .mock-form { max-width: 360px; padding: 0; border: 0; border-radius: 0; margin-top: 58px; }
  #team-login-designs .layout-open .mock-header { border-bottom: 1px solid #e5e7eb; padding-bottom: 16px; }
  #team-login-designs .layout-compact { --mock-radius: 6px; --mock-background: #ffffff; --mock-accent: #334155; }
  #team-login-designs .layout-compact .mock-header { max-width: 400px; margin: 0 auto; padding-top: 24px; }
  #team-login-designs .layout-compact .mock-form { padding: 24px 0 0; border: 0; border-top: 2px solid var(--mock-accent); border-radius: 0; margin-top: 24px; }
  #team-login-designs .layout-compact h2 { font-size: 22px; }
  @media (max-width: 420px) {
    #team-login-designs .login-mock { padding: 16px; min-height: 740px; }
    #team-login-designs .mock-form { padding: 20px 16px; }
    #team-login-designs .mock-header { align-items: flex-start; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('team-login-designs');
  const variants = root.querySelectorAll('[data-variant]');
  const designButtons = root.querySelectorAll('[data-design]');
  designButtons.forEach(button => button.addEventListener('click', () => {
    const selected = Number(button.dataset.design);
    variants.forEach((variant, index) => { variant.hidden = index !== selected; });
    designButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
  }));
  const copy = {
    ru: { brand: 'Голос команды', title: 'Вход в систему', hint: 'Введите рабочий номер телефона и пароль.', phone: 'Номер телефона', password: 'Пароль', show: 'Показать', hide: 'Скрыть', submit: 'Войти', status: 'Подключение к серверу ещё не готово. Вход пока недоступен.', access: 'Нет доступа? Обратитесь к администратору' },
    kk: { brand: 'Команда дауысы', title: 'Жүйеге кіру', hint: 'Жұмыс телефон нөмірі мен құпиясөзді енгізіңіз.', phone: 'Телефон нөмірі', password: 'Құпиясөз', show: 'Көрсету', hide: 'Жасыру', submit: 'Кіру', status: 'Серверге қосылу әлі дайын емес. Жүйеге кіру әзірге қолжетімсіз.', access: 'Кіру мүмкін емес пе? Әкімшіге хабарласыңыз' }
  };
  root.querySelectorAll('.login-mock').forEach((stage, index) => {
    stage.innerHTML = `
      <header class="mock-header">
        <p class="mock-brand" data-copy="brand"></p>
        <div class="mock-languages" role="group" aria-label="РУС / ҚАЗ">
          <button type="button" data-lang="ru" aria-pressed="true">РУС</button><span aria-hidden="true">/</span><button type="button" data-lang="kk" aria-pressed="false">ҚАЗ</button>
        </div>
      </header>
      <form class="mock-form" autocomplete="off" novalidate>
        <h2 data-copy="title"></h2>
        <p class="mock-hint" data-copy="hint"></p>
        <label for="mock-phone-${index}" data-copy="phone"></label>
        <input id="mock-phone-${index}" type="tel" placeholder="+7 (700) 000-00-00" autocomplete="off">
        <label for="mock-password-${index}" data-copy="password"></label>
        <div class="mock-password"><input id="mock-password-${index}" type="password" autocomplete="off"><button class="mock-toggle" type="button" aria-pressed="false"></button></div>
        <button class="mock-submit" type="submit" data-copy="submit"></button>
        <p class="mock-status" role="status" data-copy="status"></p>
        <p class="mock-access" data-copy="access"></p>
      </form>`;
    let language = 'ru';
    const password = stage.querySelector('[type="password"]');
    const toggle = stage.querySelector('.mock-toggle');
    function render() {
      stage.lang = language;
      stage.querySelectorAll('[data-copy]').forEach(el => { el.textContent = copy[language][el.dataset.copy]; });
      stage.querySelectorAll('[data-lang]').forEach(el => { el.setAttribute('aria-pressed', String(el.dataset.lang === language)); });
      toggle.textContent = copy[language][password.type === 'password' ? 'show' : 'hide'];
      toggle.setAttribute('aria-pressed', String(password.type === 'text'));
    }
    stage.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => { language = button.dataset.lang; render(); }));
    toggle.addEventListener('click', () => { password.type = password.type === 'password' ? 'text' : 'password'; render(); });
    stage.querySelector('form').addEventListener('submit', event => { event.preventDefault(); stage.querySelector('.mock-status').textContent = copy[language].status; });
    render();
    if (globalThis.Tweak) {
      const design = { accent: index === 2 ? '#334155' : '#2563eb', radius: index === 2 ? 6 : 12 };
      const tweak = new Tweak({ container: stage, onChange: () => { stage.style.setProperty('--mock-accent', design.accent); stage.style.setProperty('--mock-radius', design.radius + 'px'); } });
      tweak.addColorPicker(design, 'accent', { label: 'Цвет кнопки', reference: '--mock-accent' });
      tweak.addSlider(design, 'radius', { label: 'Скругление', min: 0, max: 16, unit: 'px', reference: '--mock-radius' });
    }
  });
})();
</script>
</body>
</html>
